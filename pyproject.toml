[project]
name = "autonomous-mcp-ml-pipeline"
version = "0.1.0"
description = "Local-first, MCP-driven data analysis and ML training pipeline"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.20",
  "langchain-openai>=0.3.8",
  "langgraph>=0.2.70",
  "mcp>=1.2.0",
  "polars>=1.20.0",
  "duckdb>=1.2.0",
  "pyarrow>=19.0.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.6.0",
  "xgboost>=2.1.0",
  "joblib>=1.4.0",
  "python-dotenv>=1.0.1",
  "psutil>=6.1.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.0.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0"
]

[project.scripts]
mlpipe = "main:main"
command-mcp = "mcp.command_server:main"
filesystem-mcp = "mcp.filesystem_server:main"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
